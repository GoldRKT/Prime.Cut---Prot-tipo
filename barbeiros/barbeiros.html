<!DOCTYPE html>
<html lang="pt.br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Barbeiros.css">
    <title>Document</title>
</head>
<body>

    <div class="layout">
        

        <aside class="sidebar">
        <div class="sidebar-header">
            <h2>Prime.Cut</h2>
            <p>BARBER ATELIER</p>
        </div>

        <nav class="sidebar-nav">
            <h3>Administraçâo</h3>

            <ul class="sidebar-menu">
                <li><a href="#">Dashboard</a></li>
                <li><a href="#">Barbeiros</a></li>
                <li><a href="#">Serviços</a></li>
                <li><a href="#">Produtos</a></li>
                <li><a href="#">Relatórios</a></li>  

            </ul>
        </nav>

    </aside>

    <main class="main-content">

        <header class="top-bar">
            
            <button class="top-bar-toggle" aria-label="abrir ou fechar menu lateral">

                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"       stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                     <path d="M8 4v16"></path>

                </svg>
                
            </button>

            <h1> PRIME CUT <SPan>Barbeiros</SPan></h1>

            <div class="header-action">
                
                <div class="header-box">
                    
                    <button >
                        <svg viewBox="0 0 24 24" width="16" height="16"
                         fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3         9h18c0-2-3-2-3-9"/>
                            <path d="M10 21h4"/>
                         </svg>
                     </button>
                     
                     <input type="search" placeholder="Buscar...">

                     <div class="profile-select">

                        <i class="fa-regular fa-user"></i>

                        <select name="" id="perfil" name="perfil" aria-label="Selecionar perfil">
                            <option value="admin">ADMINISTRADOR</option>
                            <option value="barbeiro">BARBEIRO</option>
                        </select>
                     </div>
            

                </div>

            </div>
        </header>

        <hr>

        <div class="corpo">
         <h2>Barbeiros</h2>
            <p>Gerencie o time e acompanhe a performance individual.</p>
        </div>

        <div class="barber-card"> 
            <h3>Rafael </h3>
            
            <p></p>
        </div>

    </main>

    </div>
    
    
    <script src="barbeiros.js"></script>
    

</body>
</html>
